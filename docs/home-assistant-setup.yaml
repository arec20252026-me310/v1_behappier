# -----------------------------------------------------------------------------
# TROUBLESHOOTING
# -----------------------------------------------------------------------------
# 
# 1. Check HA logs for errors:
#    Settings > System > Logs
#
# 2. Test the webhook manually:
#    curl -X POST "https://nxjgwifaolhdlcaoljsb.supabase.co/functions/v1/home-assistant-webhook" \
#      -H "Content-Type: application/json" \
#      -d '{"event_type": "test", "entity_id": "camera.test"}'
#
# 3. Verify camera entities exist:
#    Developer Tools > States > Search for "camera."
#
# 4. Check snapshot directory permissions:
#    ls -la /config/www/snapshots/
#
# 5. View webhook logs in Supabase:
#    SELECT * FROM ha_webhook_logs ORDER BY created_at DESC LIMIT 10;
